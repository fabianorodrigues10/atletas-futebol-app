# Netlify Configuration
# Let Netlify auto-detect pnpm from package-lock.json / pnpm-lock.yaml

[build]
  command = "pnpm build:web"
  publish = "dist/web"
  timeout = 900
  functions = "netlify/functions"

# API proxy via Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
