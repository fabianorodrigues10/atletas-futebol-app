[build]
  command = "pnpm install && pnpm build:server && npx webpack --config webpack.config.js"
  publish = "dist/web"
  timeout = 900

[[redirects]]
  from = "/api/*"
  to = "https://atletas-futebol-app.netlify.app/api/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
