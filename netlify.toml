[build]
  command = "npm ci && npm run build:web"
  publish = "dist/web"
  timeout = 900
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.20.2"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
